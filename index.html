<style>

<script>
(()=>{'use strict';
/* =====================  CONFIG (tweak me)  ===================== */
const CONFIG={
  title:'REALM OF PHYSICS AND ELECTRONICS',
  villain:'The Corruptor',        // placeholder name
  seed:20261112, world:128,
  potionDrop:0.09, itemDrop:0.13, // per enemy kill
  bossHp:3600, bossDamageScale:1,
  hubHealPerSec:14,
  baseSpeed:66, speedPerPoint:5,
  xpUnit:30, techXpUnit:25,
  enemyCountByZone:[26,50,72,90], terminalsByZone:[0,12,12,8],
  zoneRadii:[16,32,48,60],
  respawnEvery:2.5, nearCap:9,
  breakerPotionEvery:2            // level-1 breakers: a potion on every Nth repair (1 = every breaker)
};

/* =====================  utils  ===================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+7,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
const rnd=Math.random;
const pick=a=>a[(rnd()*a.length)|0];

/* =====================  audio  ===================== */
let ac=null,muted=false,lastSfx=0;
function sfx(f,d,type,v,slide){
  if(muted)return;const n=performance.now();if(n-lastSfx<18)return;lastSfx=n;
  try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
    g.gain.value=v||0.035;g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

/* =====================  save  ===================== */
const SAVE_KEY='broken-wild-proto-v1';
function defaultSave(){const c=()=>({xp:0,pot:{hp:0,atk:0,def:0,spd:0,dex:0}});
  return{v:1,classes:{knight:c(),archer:c(),wizard:c()},techXp:0,vault:Array(12).fill(null),gates:[],terms:[],devs:[],restored:false,deaths:0,kills:0,bossKills:0}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1)return Object.assign(defaultSave(),s)}catch(e){}return defaultSave()}
let save=loadSave();
if(save.lv1!==2){save.lv1=2;save.terms=[];save.devs=[];save.gates=[]}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* =====================  data  ===================== */
const CLASSES={
  knight:{name:'Knight',weapon:'sword',hp:120,atk:12,def:6,spd:4,dex:4,special:'Shield Charge',cost:40,blurb:'Tough frontliner. Short-range slashes, a dash that shrugs off hits.'},
  archer:{name:'Archer',weapon:'bow',hp:85,atk:10,def:2,spd:6,dex:7,special:'Volley',cost:35,blurb:'Fast and far-reaching. Fires a fan of arrows when pressed.'},
  wizard:{name:'Wizard',weapon:'staff',hp:70,atk:11,def:1,spd:5,dex:5,special:'Arcane Nova',cost:40,blurb:'Fragile but piercing. Releases a ring of bolts in every direction.'}
};
const WK={
  sword:{label:'Sword',dmg:[16,24,33,44,58],rate:2.4,range:56,speed:230,r:8,pierce:true,names:['Rusty Blade','Gearsteel Sword','Verdant Edge','Voltblade','Equilibrium Edge']},
  bow:{label:'Bow',dmg:[13,19,26,36,50],rate:3.0,range:190,speed:330,r:3,pierce:false,names:['Mossy Shortbow','Wire Bow','Gearstring Bow','Stormbow','Equilibrium Bow']},
  staff:{label:'Staff',dmg:[15,22,30,40,54],rate:2.6,range:150,speed:270,r:5,pierce:true,names:['Twig Staff','Copper Staff','Glowcap Staff','Void Staff','Equilibrium Staff']}
};
const ARMOR={def:[2,5,9,14,20],hp:[0,5,10,15,25],names:['Patched Vest','Copper Plate','Mossweave Mail','Voltplate','Equilibrium Armor']};
const RING={val:[1,2,3,4,6],names:['Copper','Bronze','Mossglass','Volt','Equilibrium'],stats:{atk:'Might',dex:'Haste',spd:'Swiftness',hp:'Vigor',tech:'Tinkering'}};
const TIERCOL=['#9a8f7a','#d08a4a','#6fbf5a','#5ab6e8','#f0d060'];
const POTIONS={
  hp:{name:'Life',col:'#e0463e',txt:'+5 max HP'},atk:{name:'Attack',col:'#f0922f',txt:'+1 Attack'},
  def:{name:'Defense',col:'#6a8ae8',txt:'+1 Defense'},spd:{name:'Speed',col:'#58d27a',txt:'+1 Speed'},
  dex:{name:'Dexterity',col:'#c36ae8',txt:'+1 Dexterity'},tech:{name:'Circuit',col:'#e8d84a',txt:'+30 Tech XP'}
};
const POT_KEYS=['hp','atk','def','spd','dex','hp','atk','def','spd','dex','tech','tech'];
const STAT_NAMES={hp:'Life',atk:'Attack',def:'Defense',spd:'Speed',dex:'Dexterity'};

const ZONES=[
  {name:'Mossy Shallows',anom:null,note:'Calm. The gate out is dead: restore its power.',floor:['#3d6b3a','#44753f','#386533'],dark:'#2a4d2b'},
  {name:'Rusted Grove',anom:'curve',note:'Physics bent: shots curve to the right.',floor:['#44683a','#4d6a36','#3f6035'],dark:'#2f4a2a'},
  {name:'Gearworks',anom:'slip',note:'Low friction: you slide, shots speed up.',floor:['#4a5c58','#51625e','#445551'],dark:'#35433f'},
  {name:'Corrupted Core',anom:'pulse',note:'Pulse fields: shots surge and stall.',floor:['#3f3158','#463763','#392c50'],dark:'#2a2040'}
];
const RESTORED_FLOOR=['#5a9a45','#62a24b','#528f40'];

const ETYPES={
  mossling:{name:'Mossling',hp:24,spd:36,dmg:8,r:6,ai:'melee',xp:6},
  wisp:{name:'Spark Wisp',hp:16,spd:30,dmg:9,r:5,ai:'shooter',rate:1.1,bspd:90,xp:7},
  crawler:{name:'Rust Crawler',hp:50,spd:58,dmg:14,r:6,ai:'melee',xp:12},
  turret:{name:'Bolt Turret',hp:62,spd:0,dmg:12,r:7,ai:'turret',pat:'spread',rate:0.7,bspd:100,xp:14},
  golem:{name:'Gear Golem',hp:190,spd:26,dmg:22,r:9,ai:'brute',rate:0.33,bspd:80,xp:32},
  static:{name:'Static Wisp',hp:90,spd:38,dmg:16,r:5,ai:'shooter',rate:1.4,bspd:110,xp:22},
  guard:{name:'Corrupted Guard',hp:300,spd:42,dmg:26,r:8,ai:'shooter',rate:0.9,bspd:105,burst:3,xp:45},
  husk:{name:'Husk Turret',hp:240,spd:0,dmg:20,r:8,ai:'turret',pat:'ring',rate:0.45,bspd:85,xp:40},
  boss:{name:CONFIG.villain,hp:CONFIG.bossHp,spd:30,dmg:20,r:20,ai:'boss',xp:600}
};
const ZONE_SPAWN=[['mossling','mossling','wisp'],['crawler','crawler','wisp','turret'],['golem','crawler','turret','static'],['guard','golem','husk','static']];

/* =====================  world  ===================== */
const W=CONFIG.world,TS=16,C=W/2;
const T={VOID:0,FLOOR:1,WALL:2,GATE:3,TREE:4,ROCK:5,GEAR:6};
const tiles=new Uint8Array(W*W),zoneT=new Uint8Array(W*W),gateAt=new Int16Array(W*W).fill(-1);
const gates=[],terms=[],gears=[],devs=[],D={},G={};
let shake=0,chainRot=0,shaftPh=0;
const HUB={x:C*TS,y:C*TS};
const BOSSPOS={x:C*TS,y:(C-54)*TS};
const VAULT={x:C*TS+44,y:C*TS+8};
const seen=new Uint8Array(W*W);
const mapCv=document.createElement('canvas');mapCv.width=W;mapCv.height=W;const mapCtx=mapCv.getContext('2d');

function genWorld(){
  const rng=mulberry32(CONFIG.seed),R=CONFIG.zoneRadii;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const d=Math.hypot(x+.5-C,y+.5-C),i=y*W+x;
    const z=d<R[0]?0:d<R[1]?1:d<R[2]?2:d<R[3]?3:-1;
    tiles[i]=z<0?T.VOID:T.FLOOR;zoneT[i]=Math.max(z,0);
    for(let k=0;k<3;k++){const r=R[k];if(z>=0&&d>=r&&d<r+1.6)tiles[i]=T.WALL}
  }
  const offs=[Math.PI/4,0.12,Math.PI/4+0.35];
  for(let k=0;k<3;k++){
    for(let j=0;j<4;j++){
      const a=offs[k]+j*Math.PI/2,r=R[k]+0.8;
      const gx=C+Math.cos(a)*r,gy=C+Math.sin(a)*r;
      // Ring 1 has a single powered door (j===3); its other three gate spots stay solid wall.
      const isDoor=(k===0&&j===3),isDead=(k===0&&j!==3);
      const g={id:gates.length,x:gx*TS,y:gy*TS,tx:gx,ty:gy,tier:k+1,open:(!isDoor&&!isDead&&save.gates.includes(gates.length)),door:isDoor,dead:isDead,cells:[],cd:0};
      if(!isDead)for(let y=Math.floor(gy-3);y<=Math.ceil(gy+3);y++)for(let x=Math.floor(gx-3);x<=Math.ceil(gx+3);x++){
        const i=y*W+x;if(x<0||y<0||x>=W||y>=W)continue;
        if(tiles[i]===T.WALL&&Math.hypot(x+.5-gx,y+.5-gy)<2.4){tiles[i]=T.GATE;gateAt[i]=g.id;g.cells.push(i)}
      }
      gates.push(g);
    }
  }
  const P_=(ox,oy)=>({tx:C+ox,ty:C+oy,x:(C+ox)*TS,y:(C+oy)*TS});
  for(const [key,ox,oy] of [['A',-10,-8],['B',-10,8],['C',2,-12.5],['D',12.5,3]]){const q=P_(ox,oy);const g={key,tx:q.tx,ty:q.ty,x:q.x,y:q.y,rot:key==='B'?0.7:0,w:0,jit:0,dir:(key==='A'||key==='D')?1:-1};gears.push(g);G[key]=g}
  const DV=[['M','lever',-14.6,0,1],['bA','fuse',-12.5,-4,1],['bB','fuse',-12.5,4,2],['S','sync',-8,0,2],['J','jam',-4,-10.25,2],['K','cable',0,10.5,3],

  for(const [key,type,ox,oy,diff] of DV){const q=P_(ox,oy);const d={id:devs.length,key,type,diff,ox,oy,tx:q.tx,ty:q.ty,x:q.x,y:q.y+5,done:save.devs.includes(devs.length),cd:0};devs.push(d);D[key]=d}

for(const k in ETYPES)ETYPES[k].r0=ETYPES[k].r;

function updateEnemies(dt){
  for(const e of enemies){
    const d=ETYPES[e.t];if(e.flash>0)e.flash-=dt;
    const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy);

    const ang=Math.atan2(dy,dx);e.ang=ang;e.cd-=dt;e.touch-=dt;
    const hubD=Math.hypot(e.x-HUB.x,e.y-HUB.y);
    if(hubD<110&&e.t!=='boss'){const a=Math.atan2(e.y-HUB.y,e.x-HUB.x);mv(e,Math.cos(a)*60*dt,Math.sin(a)*60*dt,d.r);e.aggro=false;continue}
    const aggroR=d.ai==='melee'?150:d.ai==='turret'?200:180;
    if(!e.aggro&&dist<aggroR)e.aggro=true;
    if(e.aggro&&dist>300&&e.t!=='boss')e.aggro=false;
    if(d.ai==='melee'){
      if(e.aggro){mv(e,Math.cos(ang)*d.spd*dt,Math.sin(ang)*d.spd*dt,d.r);if(dist<d.r+8&&e.touch<=0){takeDamage(d.dmg);e.touch=.8}}

      if(e.aggro){
        const want=dist>130?1:dist<85?-1:0;e.wt-=dt;if(e.wt<=0){e.wt=1+rnd()*1.2;e.wa=rnd()<.5?1:-1}
        const sx=-Math.sin(ang)*e.wa*.6,sy=Math.cos(ang)*e.wa*.6;
        mv(e,(Math.cos(ang)*want+sx)*d.spd*dt,(Math.sin(ang)*want+sy)*d.spd*dt,d.r);
        if(e.cd<=0){e.cd=1/d.rate;const n=d.burst||1;for(let i=0;i<n;i++)eBullet(e.x,e.y-6,ang+(i-(n-1)/2)*.16,d.bspd,d.dmg,{col:e.t==='static'||e.t==='guard'?'#d05ae8':'#f0903a'});}
        if(dist<d.r+6&&e.touch<=0){takeDamage(d.dmg*.6);e.touch=1}
      }else wander(e,dt,d)
    }else if(d.ai==='turret'){
      if(e.aggro&&e.cd<=0){e.cd=1/d.rate;
        if(d.pat==='spread'){for(let i=-1;i<=1;i++)eBullet(e.x,e.y-8,ang+i*.28,d.bspd,d.dmg)}
        else{const off=rnd()*TAU;for(let i=0;i<10;i++)eBullet(e.x,e.y-8,off+i/10*TAU,d.bspd,d.dmg,{col:'#d05ae8'})}
      }
    }else if(d.ai==='brute'){
      if(e.aggro){mv(e,Math.cos(ang)*d.spd*dt,Math.sin(ang)*d.spd*dt,d.r);
        if(e.cd<=0){e.cd=1/d.rate;for(let i=0;i<8;i++)eBullet(e.x,e.y-8,i/8*TAU+rnd()*.2,d.bspd,d.dmg*.7)}
        if(dist<d.r+8&&e.touch<=0){takeDamage(d.dmg);e.touch=.9}}
      else wander(e,dt,d)
    }else if(d.ai==='boss'){updateBoss(e,dt,dist,ang)}
  }
}
function mv(e,dx,dy,r){if(!blockedBox(e.x+dx,e.y,r))e.x+=dx;if(!blockedBox(e.x,e.y+dy,r))e.y+=dy}
function wander(e,dt,d){e.wt-=dt;if(e.wt<=0){e.wt=1+rnd()*2;e.wa=rnd()<.4?-1:rnd()*TAU}
  if(e.wa>=0&&d.spd>0)mv(e,Math.cos(e.wa)*d.spd*.3*dt,Math.sin(e.wa)*d.spd*.3*dt,d.r)}
function updateBoss(e,dt,dist,ang){
  if(!bossAwake){if(dist<300)bossAwake=true;else return}
  const hr=e.hp/e.max,ph=hr>.66?1:hr>.33?2:3;
  const want=dist>150?1:dist<90?-1:0;const sx=-Math.sin(ang)*.7,sy=Math.cos(ang)*.7;
  const sp=ph===3?40:30;mv(e,(Math.cos(ang)*want+sx)*sp*dt,(Math.sin(ang)*want+sy)*sp*dt,18);
  e.s1-=dt;e.s2-=dt;e.s3-=dt;e.s4-=dt;
  const b={boss:true,col:'#e85ae8'};
  if(e.s1<=0){e.s1=ph===3?1.8:1.5;const n=ph===3?7:5;for(let i=0;i<n;i++)eBullet(e.x,e.y-18,ang+(i-(n-1)/2)*.17,115,18,b)}
  if(e.s2<=0){e.s2=ph===3?2.6:4;const n=ph===3?18:14;const off=rnd()*TAU;for(let i=0;i<n;i++)eBullet(e.x,e.y-18,off+i/n*TAU,72,14,b)}
  if(ph>=2&&e.s3<=0){e.s3=ph===3?.09:.13;e.sp+=.37;const arms=ph===3?4:3;for(let i=0;i<arms;i++)eBullet(e.x,e.y-18,e.sp+i/arms*TAU,88,13,b)}
  if(ph>=2&&e.s4<=0){e.s4=7;const n=enemies.filter(x=>x.t==='crawler').length;if(n<8){for(let i=0;i<2;i++){const a=rnd()*TAU;const m=spawnEnemy('crawler',e.x+Math.cos(a)*30,e.y+Math.sin(a)*30);m.aggro=true}}log(CONFIG.villain+' calls rust crawlers!','#e85ae8')}

function trySpawnNear(){
  const cap=save.restored?4:CONFIG.nearCap;
  let n=0;for(const e of enemies)if(Math.hypot(e.x-P.x,e.y-P.y)<450&&e.t!=='boss')n++;

    const a=rnd()*TAU,r=270+rnd()*90,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r;
    const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(tx<0||ty<0||tx>=W||ty>=W)continue;
    if(tiles[ty*W+tx]!==T.FLOOR)continue;

    if(Math.hypot(x-BOSSPOS.x,y-BOSSPOS.y)<150)continue;
    const z=zoneT[ty*W+tx];if(!freeSpot(x,y,8))continue;

function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];if(!p)continue;p.age+=dt;p.life-=dt;
    const an=anomAt(p.x,p.y);let f=1;
    if(an==='curve')p.ang+=.95*dt;
    else if(an==='slip')p.spd=Math.min(p.spd*(1+.55*dt),p.spd0?p.spd0*1.9:(p.spd0=p.spd,p.spd*1.9));
    else if(an==='pulse')f=1+.65*Math.sin(p.age*6);
    if(p.spd0===undefined)p.spd0=p.spd;
    p.x+=Math.cos(p.ang)*p.spd*f*dt;p.y+=Math.sin(p.ang)*p.spd*f*dt;
    if(p.life<=0||solidPx(p.x,p.y)){if(p.life>0)burst(p.x,p.y,3,'#aaa',20,.2);projs.splice(i,1);continue}
    if(p.from==='p'){
      let dead=false;
      for(const e of enemies){
        const rr=e.r0+p.r;if(Math.abs(e.x-p.x)>rr||Math.abs(e.y-6-p.y)>rr+6)continue;
        if(Math.hypot(e.x-p.x,e.y-8-p.y)>rr+4)continue;
        if(p.hit){if(p.hit.has(e))continue;p.hit.add(e)}
        damageEnemy(e,p.dmg);if(!p.pierce){dead=true;break}
      }
      if(dead)projs.splice(i,1);
    }else{
      if(Math.hypot(P.x-p.x,P.y-8-p.y)<p.r+5){takeDamage(p.dmg);projs.splice(i,1)}
    }
  }
}
function updateLoot(dt){
  for(let i=loots.length-1;i>=0;i--){
    const l=loots[i];l.life-=dt;if(l.delay>0)l.delay-=dt;
    if(l.life<=0){loots.splice(i,1);continue}

function interactNow(){
  if(!interact)return;
  if(interact.k==='vault'){openVault();return}
  if(interact.k==='door'){gateHint();return}
  if(interact.k==='dev'){const d=interact.o;
    if(!reqOk(d)){log(lockMsg(d),'#ffcf70');return}
    if(d.cd>0){log('The circuits are still sparking. Wait a moment.','#ff7a6a');return}
    openDev(d);return}
  const o=interact.o;
  if(o.cd>0){log('The circuits are still sparking. Wait a moment.','#ff7a6a');return}
  const isGate=interact.k==='gate';
  const tl=effTech();
  const base=isGate?2+o.tier:2+Math.min(o.zone+1,3);
  const pairs=Math.min(6,base);
  const pre=Math.min(Math.max(0,pairs-2),Math.floor((tl-1)/2));
  const time=20+pairs*3+tl*2;
  startWire(isGate?'Repair gate (tier '+o.tier+')':'Repair dormant machine',pairs,pre,time,
    ()=>{
      gainTech(isGate?25*o.tier:18);
      if(isGate){o.open=true;save.gates.push(o.id);for(const i of o.cells)paintMapTile(i);log('The gate grinds open.','#7ad05a');
        for(let k=0;k<2;k++)addLoot(o.x,o.y+14,{potion:pick(POT_KEYS)});addLoot(o.x,o.y+14,{item:rollItem(Math.min(3,o.tier))});}
      else{o.done=true;save.terms.push(o.id);log('The machine hums back to life.','#7ad05a');
        addLoot(o.x,o.y+8,{potion:pick(POT_KEYS)});if(rnd()<.55)addLoot(o.x,o.y+8,{item:rollItem(o.zone)})}
      persist();burst(o.x,o.y-6,16,'#7ad05a',60,.7);sfx(700,.3,'triangle',.05,500);
    },
    ()=>{o.cd=3;P.inv=0;takeDamage(isGate?8:5+(o.zone||0)*2);log('Short circuit! Zapped.','#ff7a6a')}
  );
}

/* ---------- Level 1 gate system ---------- */
function gateHint(){
  const left=D_TOTAL-devDone();
  log('The gate has two leaves: gear C drives the left, gear D the right.','#bde8a0');
  log(left+' repairs to go. '+objective()+'.','#ffcf70');
  if(D.S.done)log('Follow the chain from A, the cable from B and the cables from the five breakers.','#bde8a0');
}
function zapDev(d){d.cd=3;P.inv=0;takeDamage(4+d.diff*2);log('Short circuit! Zapped.','#ff7a6a')}
function gearKick(k){G[k].jit=.8}
function completeDev(d){
  d.done=true;save.devs.push(d.id);persist();
  gainTech(10+d.diff*6);
  burst(d.x,d.y-8,18,'#7ad05a',60,.7);sfx(700,.3,'triangle',.05,500);floatTxt(d.x,d.y-26,'POWER','#7ad05a');
  const k=d.key,gl=(m,c)=>log(m,c||'#7ad05a');
  if(k==='M'){gl('The lever clunks home. Cables glow along the wall.');gl('Gears A and B have lost their fuses.','#ffcf70')}
  else if(k==='bA'){gearKick('A');gl('Fuse A is in. Gear A shudders and starts to turn.');if(D.bB.done)gl('Both gears turn, out of step. Sync them.','#ffcf70')}
  else if(k==='bB'){gearKick('B');gl('Fuse B is in. Gear B shudders and starts to turn.');if(D.bA.done)gl('Both gears turn, out of step. Sync them.','#ffcf70')}
  else if(k==='S'){G.B.rot=-G.A.rot;gearKick('A');gearKick('B');gl('The gears lock into step. Power flows on.');gl('Two links are broken: the A chain, the B cable.','#ffcf70')}
  else if(k==='J'){gearKick('C');gl('The chain runs free. Gear C turns: the gate’s left leaf has drive.');if(D.K.done)gl('Both leaves have drive.','#ffcf70')}
  else if(k==='K'){gearKick('D');gl('The cable is whole. Gear D turns: the right leaf has power.');if(D.J.done)gl('Both leaves have drive.','#ffcf70')}
  else{const n=breakersOn();gl('Breaker '+n+' of 5 on. A charge cell lights on the gate.');if(n===5)gl('The gate’s charge is full.','#ffcf70');

function initFuse(){

  const opts=[[a,b]];let guard=0;
  while(opts.length<n&&guard++<200){let o;
    if(pz.d.diff===1)o=[(rnd()*5)|0,(rnd()*5)|0];
    else{const r=rnd();o=r<.4?[a,(rnd()*5)|0]:r<.8?[(rnd()*5)|0,b]:[b,a]}
    if(!opts.some(q=>q[0]===o[0]&&q[1]===o[1]))opts.push(o)}
  opts.sort(()=>rnd()-.5);
  pz.target=[a,b];pz.opts=opts;pz.burnt=opts.map(()=>false);
}

const WCOL=['#e84b4b','#4bd0e8','#f0d24a','#7ad05a','#c46ae8','#f08a3a'];
const wire={on:false};
function startWire(title,pairs,pre,tmax,onWin,onFail,info){
  const perm=[...Array(pairs).keys()];for(let i=pairs-1;i>0;i--){const j=(rnd()*(i+1))|0;[perm[i],perm[j]]=[perm[j],perm[i]]}
  const done=Array(pairs).fill(false);const idx=[...Array(pairs).keys()].sort(()=>rnd()-.5);for(let k=0;k<pre;k++)done[idx[k]]=true;
  Object.assign(wire,{on:true,pairs,perm,done,sel:-1,miss:0,t:tmax,max:tmax,onWin,onFail,title,pre,info:info||'',end:false});
  renderWire();openModal('wire');
}
function renderWire(){
  const w=wire,H=150,step=H/w.pairs;
  let svg='',nodes='';
  for(let i=0;i<w.pairs;i++){
    const yl=step*i+step/2,ri=w.perm.indexOf(i),yr=step*ri+step/2;
    if(w.done[i])svg+=`<polyline fill="none" stroke="${WCOL[i]}" stroke-width="4" points="22,${yl} 90,${yl} 170,${yr} 238,${yr}"/>`;
    nodes+=`<button class="node${w.done[i]?' done':''}${w.sel===i?' sel':''}" style="--c:${WCOL[i]};left:4px;top:${yl-9}px" data-side="L" data-c="${i}" aria-label="Left terminal ${i+1}"></button>`;
    const c=w.perm[ri===undefined?0:ri];
  }
  for(let r=0;r<w.pairs;r++){const c=w.perm[r],yr=step*r+step/2;
    nodes+=`<button class="node${w.done[c]?' done':''}" style="--c:${WCOL[c]};left:238px;top:${yr-9}px" data-side="R" data-c="${c}" aria-label="Right terminal ${r+1}"></button>`}
  $('m-wire').innerHTML=`<h2>${w.title}</h2>${w.info?'<p class="pzinfo">'+w.info+'</p>':''}<p>Join each colour on the left to its match on the right. ${w.pre?'<span class="good">'+w.pre+' wire'+(w.pre>1?'s':'')+' pre-linked by your Tech skill.</span>':''}</p>
  <div class="tbar"><div id="wt" style="width:${w.t/w.max*100}%"></div></div>
  <div id="wireArea"><svg width="260" height="150">${svg}</svg>${nodes}</div>
  <div class="row"><span id="wm" class="dim">Mistakes: ${w.miss}/3</span><span style="flex:1"></span><button class="btn" id="wcancel">Step back (Esc)</button></div>`;
  $('wcancel').onclick=()=>cancelWire();
  $('m-wire').querySelectorAll('.node').forEach(n=>n.onclick=()=>wireClick(n));
}
function wireClick(n){
  const w=wire;if(!w.on||w.end)return;const c=+n.dataset.c;
  if(w.done[c])return;
  if(n.dataset.side==='L'){w.sel=c;sfx(500,.04,'square',.02);renderWire();return}
  if(w.sel<0){return}
  if(w.sel===c){w.done[c]=true;w.sel=-1;sfx(660,.08,'triangle',.04);renderWire();
    if(w.done.every(Boolean)){w.end=true;setTimeout(()=>{if(!w.on)return;w.on=false;closeModal();w.onWin()},350)}}
  else{w.miss++;w.sel=-1;sfx(110,.15,'sawtooth',.05);renderWire();n=$('m-wire').querySelector(`.node[data-side="R"][data-c="${c}"]`);if(n){n.classList.add('bad')}
    if(w.miss>=3){failWire()}}
}
function failWire(){const w=wire;if(!w.on)return;w.on=false;w.end=true;closeModal();w.onFail()}
function cancelWire(){wire.on=false;closeModal()}
function tickWire(dt){
  if(!wire.on||wire.end)return;wire.t-=dt;const el=$('wt');if(el)el.style.width=Math.max(0,wire.t/wire.max*100)+'%';

  R(c,-7,-2,14,2,'rgba(0,0,0,.3)');
  if(d.type==='lever'){
    R(c,-8,-20,16,20,'#1b140e');R(c,-7,-19,14,18,'#5c4a3a');R(c,-2,-15,4,12,'#1b140e');
    const ky=on?-16:-6;R(c,-1,ky,2,on?5:6,'#9a9aa4');R(c,-3,ky-2,6,4,on?'#7ad05a':'#c8452f');R(c,-6,-19,3,3,lamp);return}
  if(d.type==='sync'){
    c.fillStyle='#1b140e';c.beginPath();c.arc(0,-10,9,0,TAU);c.fill();c.fillStyle='#d8d0c0';c.beginPath();c.arc(0,-10,7,0,TAU);c.fill();
    R(c,-1,-16,2,3,'#7ad05a');const a=on?-Math.PI/2:-Math.PI/2+Math.sin(ti*3)*.9;strokeP(c,[[0,-10],[Math.cos(a)*6,-10+Math.sin(a)*6]],2,'#c8452f');R(c,5,-4,3,3,lamp);return}
  if(d.type==='jam'||d.type==='cable'){ // marker post beside the broken spot
    R(c,-1,-12,2,12,'#3a2a1e');R(c,-4,-14,8,4,'#1b140e');R(c,-3,-13,6,2,lamp);return}
  R(c,-7,-13,14,12,'#1b140e');R(c,-6,-12,12,10,on?'#4a6a4a':'#5c4a3a');R(c,-5,-11,10,3,'#1b140e');R(c,-4,-10,8,1,lamp);
  if(d.type==='fuse'){R(c,-3,-7,2,4,on?'#e8d84a':'#222');R(c,1,-7,2,4,on?'#e8d84a':'#222')}
  else if(d.type==='panel'){for(let i=0;i<3;i++)R(c,-4+i*3,-7,2,4,on?'#7ad05a':(i%2?'#c8452f':'#9a9aa4'))}
  else{R(c,-4,-7,2,4,'#e84b4b');R(c,-1,-7,2,4,'#4bd0e8');R(c,2,-7,2,4,'#f0d24a')}
}
function drawTerm(c,t,ti){
  const done=t.done;R(c,-6,-2,12,2,'rgba(0,0,0,.3)');R(c,-6,-12,12,10,done?'#4a6a4a':'#5c4a3a');R(c,-5,-11,10,5,'#1b140e');
  R(c,-4,-10,8,3,done?'#7ad05a':(Math.sin(ti*4+t.id)>0?'#ff6a3a':'#8a3a22'));R(c,-3,-4,2,2,'#e8d84a');R(c,1,-4,2,2,'#6a8ae8');
  if(done)R(c,-5,-14,3,2,'#5fa84a');
}
function drawCompanion(c,ti){
  const b=Math.round(Math.sin(ti*6)*1);R(c,-4,-1,8,2,'rgba(0,0,0,.28)');R(c,-4,-8+b,8,6,'#8a5a3a');R(c,-3,-7+b,6,2,'#a87a4a');R(c,-2,-5+b,1,1,'#7ae0ff');R(c,1,-5+b,1,1,'#7ae0ff');R(c,-3,-2,2,2,'#5a3a22');R(c,1,-2,2,2,'#5a3a22');
  R(c,-1,-12+b,2,4,'#5fb04a');R(c,-4,-12+b,3,2,'#7ad05a');R(c,1,-13+b,3,2,'#7ad05a');R(c,2,-15+b,2,2,'#f08a5a');
}
function drawHubDecor(c,ti){
  // portal ring
  const px=HUB.x-camX,py=HUB.y-34-camY;
  c.save();c.translate(Math.round(px),Math.round(py));
  c.fillStyle='#4a3020';c.beginPath();c.arc(0,0,17,0,TAU);c.fill();
  for(let i=0;i<10;i++){const a=i/10*TAU+ti*.15;c.save();c.translate(Math.cos(a)*17,Math.sin(a)*17);c.rotate(a);R(c,-3,-3,6,6,'#8a5a2a');c.restore()}
  c.fillStyle='#1a0e2a';c.beginPath();c.arc(0,0,12,0,TAU);c.fill();
  for(let i=0;i<14;i++){const a=i*.7+ti*2,r=i*.8;R(c,Math.cos(a)*r-1,Math.sin(a)*r-1,2,2,i%2?'#e89ad8':'#7ab0ff')}
  c.restore();
  // vault chest
  const vx=VAULT.x-camX,vy=VAULT.y-camY;c.save();c.translate(Math.round(vx),Math.round(vy));
  R(c,-8,-2,16,2,'rgba(0,0,0,.3)');R(c,-8,-12,16,10,'#7a5028');R(c,-8,-12,16,4,'#9a6a38');R(c,-1,-9,2,4,'#e8d84a');R(c,-8,-8,16,1,'#3a2410');c.restore();
}
const grads={};
function vignette(c){
  if(!grads.v){const g=c.createRadialGradient(320,180,120,320,180,380);g.addColorStop(0,'rgba(5,10,12,0)');g.addColorStop(1,'rgba(5,10,12,.62)');grads.v=g}
  c.fillStyle=grads.v;c.fillRect(0,0,640,360);
}
function drawTileGround(c,tx,ty,sx,sy,t,z,ti){
  const i=ty*W+tx;
  if(t===T.VOID){R(c,sx,sy,TS,TS,'#0c1b1f');const h=hash2(tx,ty,11);if(h>.93)R(c,sx+(h*97%12),sy+(h*53%12),1,1,'#8ad0ff');return}
  const h=hash2(tx,ty,1);
  const dh=Math.hypot(tx+.5-C,ty+.5-C);
  let pal=save.restored?RESTORED_FLOOR:ZONES[z].floor;
  if(dh<4.2){R(c,sx,sy,TS,TS,h<.5?'#8a8a78':'#7e7e6c');R(c,sx,sy,TS,1,'#6a6a58');R(c,sx,sy,1,TS,'#6a6a58');if(h>.7)R(c,sx+3,sy+4,5,3,'#5fa84a');return}
  R(c,sx,sy,TS,TS,pal[(h*3)|0]);
  if(t===T.WALL){
    R(c,sx,sy,TS,TS,'#6b4a30');R(c,sx,sy,TS,3,'#8a6a44');R(c,sx,sy+TS-2,TS,2,'#4a3220');
    if(hash2(tx,ty,2)>.5)R(c,sx+2,sy+6,6,3,'#a0602e');if(hash2(tx,ty,4)>.55)R(c,sx+6,sy,8,2,'#5fa84a');if(h>.8)R(c,sx+9,sy+8,4,4,'#4a3220');
    return}
  if(t===T.GATE){const g=gates[gateAt[i]];
    if(g.open||g.opening){R(c,sx,sy,TS,TS,pal[(h*3)|0]);if(!g.door)R(c,sx+2,sy+2,TS-4,TS-4,'#2a2018')}
    else{R(c,sx,sy,TS,TS,'#4a3a30');R(c,sx,sy,TS,2,'#6a5444');R(c,sx+2,sy+4,2,2,'#2a1c12');R(c,sx+TS-4,sy+TS-6,2,2,'#2a1c12')}
    return}
  const dk=save.restored?'#3f7a35':ZONES[z].dark,h2=hash2(tx,ty,7);
  if(h2>.82)R(c,sx+(h2*131%9)|0,sy+(h2*71%9)|0,5,3,dk);
  const h3=hash2(tx,ty,9);
  if(z<=1||save.restored){if(h3>.93){R(c,sx+4,sy+6,1,5,'#2f7a38');R(c,sx+6,sy+4,1,7,'#3a9a46');R(c,sx+8,sy+7,1,4,'#2f7a38')}
    else if(h3>.9){R(c,sx+6,sy+9,2,3,'#d8b0a0');R(c,sx+5,sy+7,4,2,'#ff9ad8')}}
  else if(z===2){R(c,sx,sy,TS,1,'#5a6c68');R(c,sx,sy,1,TS,'#5a6c68');if(h3>.9)R(c,sx+5,sy+5,3,3,'#8a5a2a')}
  else{if(h3>.88){R(c,sx+3,sy+(h3*100%10|0),9,1,'#9a5ae8')}}
}
function render(){
  const c=ctx,ti=performance.now()/1000;
  c.imageSmoothingEnabled=false;
  camX=Math.round(P.x-320+(shake>0?(rnd()-.5)*shake*2:0));camY=Math.round(P.y-190+(shake>0?(rnd()-.5)*shake*2:0));
  c.fillStyle='#0c1b1f';c.fillRect(0,0,640,360);
  const tx0=Math.floor(camX/TS),ty0=Math.floor(camY/TS),tx1=tx0+41,ty1=ty0+24;
  const drawList=[];
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const t=tileAt(tx,ty),sx=tx*TS-camX,sy=ty*TS-camY,z=(tx<0||ty<0||tx>=W||ty>=W)?3:zoneT[ty*W+tx];
    drawTileGround(c,tx,ty,sx,sy,t,z,ti);
    if(t===T.TREE)drawList.push({y:(ty+1)*TS,f:g=>{g.save();g.translate(sx+8,sy+TS);drawTree(g,tx,ty,z);g.restore()}});
    else if(t===T.ROCK)drawList.push({y:(ty+1)*TS,f:g=>{g.save();g.translate(sx+8,sy+TS);drawRock(g,tx,ty);g.restore()}});
    else if(t===T.GEAR)drawList.push({y:(ty+1)*TS,f:g=>{g.save();g.translate(sx+8,sy+TS);drawGearObs(g,t,z);g.restore()}});
    else if(t===T.VOID&&tx%4===0&&ty%4===0&&hash2(tx>>2,ty>>2,99)>.8){
      const by=Math.round(Math.sin(ti+tx)*3);R(c,sx+2,sy+by+4,20,8,'#5a4632');R(c,sx+4,sy+by+12,14,4,'#3a2c20');R(c,sx+2,sy+by+1,20,4,'#4a8a3a');R(c,sx+6,sy+by-1,6,2,'#6bb04a');R(c,sx+12,sy+by+2,3,5,'#3fa0e8')}
  }
  drawSystem(c,ti);
  for(const g of gates){if(g.dead||g.door)continue;drawGateGear(c,g,ti)}
  drawHubDecorQueue(drawList,ti);
  for(const v of devs){const x=v.x-camX,y=v.y-camY;if(x<-20||y<-30||x>660||y>380)continue;drawList.push({y:v.y,f:g=>{g.save();g.translate(Math.round(x),Math.round(y));drawDev(g,v,ti);g.restore()}})}
  for(const t of terms){const x=t.x-camX,y=t.y-camY;if(x<-20||y<-20||x>660||y>380)continue;drawList.push({y:t.y,f:g=>{g.save();g.translate(Math.round(x),Math.round(y));drawTerm(g,t,ti);g.restore()}})}
  for(const l of loots){const x=l.x-camX,y=l.y-camY;if(x<-10||y<-10||x>650||y>370)continue;
    drawList.push({y:l.y,f:g=>{const b=Math.round(Math.sin(ti*3+l.t0)*1.5);
      if(l.potion){const p=POTIONS[l.potion];R(g,x-3,y-9+b,6,2,'#ddd');R(g,x-4,y-7+b,8,6,p.col);R(g,x-2,y-6+b,2,2,'rgba(255,255,255,.7)')}
      else{R(g,x-5,y-5,10,2,'rgba(0,0,0,.3)');R(g,x-5,y-9+b,10,8,'#d8d0c0');R(g,x-5,y-9+b,10,2,'#fff');R(g,x-1,y-6+b,2,3,TIERCOL[l.item.tier])}}})}
  for(const e of enemies){const x=e.x-camX,y=e.y-camY;if(x<-60||y<-70||x>700||y>420)continue;
    drawList.push({y:e.y,f:g=>{R(g,x-6,y-1,12,2,'rgba(0,0,0,.28)');g.save();g.translate(Math.round(x),Math.round(y));drawEnemy(g,e,ti,e.flash>0);g.restore();
      if(e.hp<e.max&&e.t!=='boss'){R(g,x-8,y+3,16,3,'#000');R(g,x-7,y+4,14*e.hp/e.max,1,'#d8453a')}}})}
  drawList.push({y:companion.y,f:g=>{g.save();g.translate(Math.round(companion.x-camX),Math.round(companion.y-camY));drawCompanion(g,ti);g.restore()}});
  drawList.push({y:P.y,f:g=>{g.save();g.translate(Math.round(P.x-camX),Math.round(P.y-camY));
    if(P.inv>0&&P.flash<=0&&Math.floor(ti*20)%2===0)g.globalAlpha=.5;
    drawHero(g,P.cls,P.aim,Math.sin(P.step)*1.2,P.flash>0,P.eq.weapon?P.eq.weapon.tier:0);g.restore()}});
  drawList.sort((a,b)=>a.y-b.y);for(const d of drawList)d.f(c);
  for(const p of projs)if(p.x-camX>-10&&p.x-camX<650)drawProj(c,{...p,x:p.x-camX,y:p.y-camY});
  for(const p of parts){c.globalAlpha=clamp(p.life/p.max,0,1);R(c,p.x-camX,p.y-camY,p.s,p.s,p.col)}c.globalAlpha=1;
  // motes
  for(const m of motes){c.globalAlpha=.55+.4*Math.sin(ti*2+m.ph);R(c,m.x,m.y,m.z>.8?2:1,m.z>.8?2:1,m.c)}c.globalAlpha=1;
  // floaters
  c.font='8px "Press Start 2P",monospace';c.textAlign='center';
  for(const f of floats){c.globalAlpha=clamp(f.life*1.5,0,1);c.fillStyle='#000';c.fillText(f.txt,Math.round(f.x-camX)+1,Math.round(f.y-camY)+1);c.fillStyle=f.col;c.fillText(f.txt,Math.round(f.x-camX),Math.round(f.y-camY))}c.globalAlpha=1;
  // zone tint
  if(!save.restored){const z=zoneAtPx(P.x,P.y);if(z===3){c.fillStyle='rgba(90,20,130,'+(.12+.05*Math.sin(ti*3))+')';c.fillRect(0,0,640,360);if(Math.random()<.04){c.fillStyle='rgba(220,150,255,.12)';c.fillRect(0,(Math.random()*360)|0,640,2)}}
    else if(z===2){c.fillStyle='rgba(30,60,70,.1)';c.fillRect(0,0,640,360)}}
  else{c.fillStyle='rgba(255,226,160,.07)';c.fillRect(0,0,640,360)}
  vignette(c);
}
function drawHubDecorQueue(list,ti){list.push({y:HUB.y-20,f:g=>drawHubDecor(g,ti)})}

/* =====================  input  ===================== */
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='escape'){if(modal==='puz')cancelPuz();else if(modal==='wire')cancelWire();else if(modal&&modal!=='class'&&modal!=='dead'&&modal!=='win')closeModal();else if(!modal&&running)showMenu();else if(modal==='win')closeModal();return}
  if(modal==='puz'&&pz.on&&pz.type==='sync'&&(k===' '||k==='enter'||k==='e')){e.preventDefault();syncPress();return}
  if(modal){return}
  if(!running)return;
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='e')interactNow();
  else if(k==='r'&&P.recall<=0){P.recall=3;log('Recalling to the hub… stay out of harm’s way.','#9a6ae8')}
  else if(k==='1')showTech();else if(k==='2')showStats();else if(k==='3')showBook();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=mouse.right=false});
function setMouse(e){const r=$('stage').getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*640;mouse.y=(e.clientY-r.top)/r.height*360}
cv.addEventListener('mousemove',setMouse);window.addEventListener('mousemove',setMouse);
cv.addEventListener('mousedown',e=>{setMouse(e);if(e.button===0)mouse.down=true;if(e.button===2)mouse.right=true;if(ac&&ac.state==='suspended')ac.resume()});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.right=false});
$('bTech').onclick=()=>{if(running&&!modal)showTech()};$('bStats').onclick=()=>{if(running&&!modal)showStats()};
$('bBook').onclick=()=>{if(running&&!modal)showBook()};$('bGear').onclick=()=>{if(running&&!modal)showMenu()};

/* =====================  scale + loop  ===================== */
function fit(){const s=Math.min(innerWidth/640,innerHeight/360);$('stage').style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running&&!modal)update(dt);
  else if(modal==='wire')tickWire(dt);
  else if(modal==='puz')tickPuz(dt);
  else if(!running){time+=dt;for(const m of motes){m.x-=4*m.z*dt;if(m.x<-4)m.x=644}}
  render();updateHUD();drawMini();
  requestAnimationFrame(frame);
}
P.zone=0;revealAround(HUB.x,HUB.y);
for(let i=0;i<W*W;i++)if(seen[i])paintMapTile(i);
showClassSelect(true);
requestAnimationFrame(frame);
})();
