<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realm of Physics and Electronics – Prototype v0.1</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1618;--panel:#2a2018;--panel-in:#3b2d20;--panel-hi:#4d3b29;--edge:#120c08;--rim:#7a5a33;--text:#eadfc4;--dim:#a8946f;--hp:#d93a32;--mp:#3a7bdc;--good:#7ad05a;--warn:#f0b24a;--bad:#ff7a6a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;color:var(--text);-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative;width:640px;height:360px;flex:none;overflow:hidden;background:#0d1d21;transform-origin:center center}
#cv{position:absolute;left:0;top:0;width:640px;height:360px;image-rendering:pixelated;cursor:crosshair;display:block}
.box{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--rim)}
.ibtn{position:absolute;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;color:var(--text);padding:0;font-family:inherit;line-height:1}
.ibtn:hover,.btn:hover{background:var(--panel-hi)}
.ibtn:focus-visible,.btn:focus-visible,.slot:focus-visible,.node:focus-visible{outline:2px solid var(--warn);outline-offset:1px}
#bTech{left:6px;top:6px}#bStats{left:6px;top:34px}#bBook{left:6px;top:62px}#bGear{right:6px;top:6px}
#zoneTag{position:absolute;left:0;right:0;top:7px;text-align:center;font-size:7px;color:#d8e8d0;text-shadow:1px 1px 0 #000;pointer-events:none}
#zoneTag small{display:block;font-size:6px;color:var(--warn);margin-top:4px}
#boss{position:absolute;left:190px;top:34px;width:260px;display:none;pointer-events:none;padding:4px 6px;font-size:7px;text-align:center}
#boss .bar{height:7px;background:#1a0e12;border:1px solid #000;margin-top:4px}#boss .fill{height:100%;background:#c23bd8;width:100%}
#prompt{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:8px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none}
#recall{position:absolute;left:230px;top:290px;width:180px;display:none;padding:4px;font-size:7px;text-align:center}
#recall .bar{height:5px;background:#000;margin-top:3px}#recall .fill{height:100%;background:#9a6ae8;width:0}
#log{position:absolute;left:8px;bottom:6px;width:268px;height:46px;font-size:6px;line-height:9px;background:rgba(0,0,0,.62);border:1px solid #000;padding:3px 4px;pointer-events:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock{position:absolute;left:402px;top:262px;width:232px;height:92px;pointer-events:none}
#dock>*{pointer-events:auto}
#slots{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(4,21px);gap:1px;padding:2px;width:90px}
.slot{width:20px;height:20px;background:#1b140e;border:1px solid #000;box-shadow:inset 0 0 0 1px #4a3826;position:relative;cursor:pointer;padding:0}
.slot img{width:18px;height:18px;image-rendering:pixelated;display:block;margin:0}
.slot.ph::after{content:attr(data-ph);position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6px;color:#5a4630}
.slot.ab{cursor:default}
.slot .cd{position:absolute;left:0;bottom:0;width:100%;background:rgba(0,0,0,.65);height:0}
#mini{position:absolute;left:92px;top:2px;width:140px;height:62px;background:#000;border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--rim);image-rendering:pixelated}
.bar2{position:absolute;left:0;width:232px;border:2px solid var(--edge);background:#150d0a;box-shadow:inset 0 0 0 1px #4a3826}
.bar2 .f{height:100%}.bar2 span{position:absolute;left:0;right:0;top:0;text-align:center;font-size:6px;line-height:9px;text-shadow:1px 1px 0 #000;color:#fff}
#hpb{top:67px;height:13px}#hpb .f{background:var(--hp)}#enb{top:80px;height:11px}#enb .f{background:var(--mp)}#enb span{line-height:7px}
#ov{position:absolute;inset:0;background:rgba(5,12,10,.74);display:none;align-items:center;justify-content:center;z-index:20}
.mod{display:none;max-width:600px;padding:12px 14px;font-size:7px;line-height:12px}
.mod h2{margin:0 0 8px;font-size:10px;font-weight:400;color:var(--warn);line-height:14px}
.mod h3{margin:8px 0 4px;font-size:7px;font-weight:400;color:#bde8a0}
.mod p{margin:0 0 6px}.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.btn{font-family:inherit;font-size:7px;color:var(--text);background:var(--panel-in);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--rim);padding:6px 9px;cursor:pointer;line-height:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{border-collapse:collapse;width:100%}td,th{padding:2px 4px;text-align:left;font-weight:400;border-bottom:1px solid #4a3826}
.cards{display:flex;gap:8px;margin-top:8px}
.card{flex:1;background:var(--panel-in);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--rim);padding:8px;cursor:pointer;font:inherit;color:var(--text);text-align:left;font-size:6px;line-height:10px}
.card:hover{background:var(--panel-hi)}.card canvas{display:block;margin:0 auto 4px;image-rendering:pixelated}
.card b{display:block;font-weight:400;font-size:8px;color:var(--warn);margin-bottom:3px;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(4,22px);gap:2px;margin:4px 0}.vgrid .slot{width:22px;height:22px}.vgrid .slot img{width:20px;height:20px}
#wireArea{position:relative;width:260px;height:150px;margin:6px auto}
#wireArea svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:18px;height:18px;border:2px solid #000;background:var(--c);cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.node.done{opacity:.45;cursor:default}.node.sel{outline:2px solid #fff}.node.bad{background:#fff}
.tbar{height:6px;background:#000;border:1px solid #000;margin:4px 0}.tbar div{height:100%;background:var(--good);width:100%}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="640" height="360"></canvas>
  <button class="box ibtn" id="bTech" title="Tech skills (1)" aria-label="Tech skills">🔧</button>
  <button class="box ibtn" id="bStats" title="Hero stats (2)" aria-label="Hero stats">🧪</button>
  <button class="box ibtn" id="bBook" title="Journal (3)" aria-label="Journal">📖</button>

  <div id="zoneTag"></div>
  <div id="boss" class="box"><span id="bossName"></span><div class="bar"><div class="fill" id="bossFill"></div></div></div>
  <div id="prompt"></div>
  <div id="recall" class="box">Recalling to the hub…<div class="bar"><div class="fill" id="recallFill"></div></div></div>
  <div id="log"></div>
  <div id="dock">
    <div id="slots" class="box"></div>
    <canvas id="mini" width="140" height="62"></canvas>
    <div class="bar2" id="hpb"><div class="f" id="hpf"></div><span id="hpt"></span></div>

  <div id="ov">
    <div class="mod box" id="m-class" style="width:580px"></div>
    <div class="mod box" id="m-stats" style="width:440px"></div>
    <div class="mod box" id="m-tech" style="width:440px"></div>
    <div class="mod box" id="m-book" style="width:500px"></div>
    <div class="mod box" id="m-menu" style="width:340px"></div>
    <div class="mod box" id="m-vault" style="width:400px"></div>
    <div class="mod box" id="m-wire" style="width:340px"></div>
    <div class="mod box" id="m-dead" style="width:400px"></div>
    <div class="mod box" id="m-win" style="width:480px"></div>
  </div>
</div>

<script>
(()=>{'use strict';
/* =====================  CONFIG (tweak me)  ===================== */
const CONFIG={
  title:'REALM OF PHYSICS AND ELECTRONICS',
  villain:'The Corruptor',        // placeholder name
  seed:20261112, world:128,
  potionDrop:0.09, itemDrop:0.13, // per enemy kill
  bossHp:3600, bossDamageScale:1,
  hubHealPerSec:14,
  baseSpeed:66, speedPerPoint:5,
  xpUnit:30, techXpUnit:25,
  enemyCountByZone:[26,50,72,90], terminalsByZone:[9,12,12,8],
  zoneRadii:[16,32,48,60],
  respawnEvery:2.5, nearCap:9
};

/* =====================  utils  ===================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+7,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
const rnd=Math.random;
const pick=a=>a[(rnd()*a.length)|0];

/* =====================  audio  ===================== */
let ac=null,muted=false,lastSfx=0;
function sfx(f,d,type,v,slide){
  if(muted)return;const n=performance.now();if(n-lastSfx<18)return;lastSfx=n;
  try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
    g.gain.value=v||0.035;g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

/* =====================  save  ===================== */
const SAVE_KEY='broken-wild-proto-v1';
function defaultSave(){const c=()=>({xp:0,pot:{hp:0,atk:0,def:0,spd:0,dex:0}});
  return{v:1,classes:{knight:c(),archer:c(),wizard:c()},techXp:0,vault:Array(12).fill(null),gates:[],terms:[],restored:false,deaths:0,kills:0,bossKills:0}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1)return Object.assign(defaultSave(),s)}catch(e){}return defaultSave()}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* =====================  data  ===================== */
const CLASSES={
  knight:{name:'Knight',weapon:'sword',hp:120,atk:12,def:6,spd:4,dex:4,special:'Shield Charge',cost:40,blurb:'Tough frontliner. Short-range slashes, a dash that shrugs off hits.'},
  archer:{name:'Archer',weapon:'bow',hp:85,atk:10,def:2,spd:6,dex:7,special:'Volley',cost:35,blurb:'Fast and far-reaching. Fires a fan of arrows when pressed.'},
  wizard:{name:'Wizard',weapon:'staff',hp:70,atk:11,def:1,spd:5,dex:5,special:'Arcane Nova',cost:40,blurb:'Fragile but piercing. Releases a ring of bolts in every direction.'}
};
const WK={
  sword:{label:'Sword',dmg:[16,24,33,44,58],rate:2.4,range:56,speed:230,r:8,pierce:true,names:['Rusty Blade','Gearsteel Sword','Verdant Edge','Voltblade','Equilibrium Edge']},
  bow:{label:'Bow',dmg:[13,19,26,36,50],rate:3.0,range:190,speed:330,r:3,pierce:false,names:['Mossy Shortbow','Wire Bow','Gearstring Bow','Stormbow','Equilibrium Bow']},
  staff:{label:'Staff',dmg:[15,22,30,40,54],rate:2.6,range:150,speed:270,r:5,pierce:true,names:['Twig Staff','Copper Staff','Glowcap Staff','Void Staff','Equilibrium Staff']}
};
const ARMOR={def:[2,5,9,14,20],hp:[0,5,10,15,25],names:['Patched Vest','Copper Plate','Mossweave Mail','Voltplate','Equilibrium Armor']};
const RING={val:[1,2,3,4,6],names:['Copper','Bronze','Mossglass','Volt','Equilibrium'],stats:{atk:'Might',dex:'Haste',spd:'Swiftness',hp:'Vigor',tech:'Tinkering'}};
const TIERCOL=['#9a8f7a','#d08a4a','#6fbf5a','#5ab6e8','#f0d060'];
const POTIONS={
  hp:{name:'Life',col:'#e0463e',txt:'+5 max HP'},atk:{name:'Attack',col:'#f0922f',txt:'+1 Attack'},
  def:{name:'Defense',col:'#6a8ae8',txt:'+1 Defense'},spd:{name:'Speed',col:'#58d27a',txt:'+1 Speed'},
  dex:{name:'Dexterity',col:'#c36ae8',txt:'+1 Dexterity'},tech:{name:'Circuit',col:'#e8d84a',txt:'+30 Tech XP'}
};
const POT_KEYS=['hp','atk','def','spd','dex','hp','atk','def','spd','dex','tech','tech'];
const STAT_NAMES={hp:'Life',atk:'Attack',def:'Defense',spd:'Speed',dex:'Dexterity'};

const ZONES=[
  {name:'Mossy Shallows',anom:null,note:'Calm. The machines here still sleep.',floor:['#3d6b3a','#44753f','#386533'],dark:'#2a4d2b'},
  {name:'Rusted Grove',anom:'curve',note:'Physics bent: shots curve to the right.',floor:['#44683a','#4d6a36','#3f6035'],dark:'#2f4a2a'},
  {name:'Gearworks',anom:'slip',note:'Low friction: you slide, shots speed up.',floor:['#4a5c58','#51625e','#445551'],dark:'#35433f'},
  {name:'Corrupted Core',anom:'pulse',note:'Pulse fields: shots surge and stall.',floor:['#3f3158','#463763','#392c50'],dark:'#2a2040'}
];
const RESTORED_FLOOR=['#5a9a45','#62a24b','#528f40'];

const ETYPES={
  mossling:{name:'Mossling',hp:24,spd:36,dmg:8,r:6,ai:'melee',xp:6},
  wisp:{name:'Spark Wisp',hp:16,spd:30,dmg:9,r:5,ai:'shooter',rate:1.1,bspd:90,xp:7},
  crawler:{name:'Rust Crawler',hp:50,spd:58,dmg:14,r:6,ai:'melee',xp:12},
  turret:{name:'Bolt Turret',hp:62,spd:0,dmg:12,r:7,ai:'turret',pat:'spread',rate:0.7,bspd:100,xp:14},
  golem:{name:'Gear Golem',hp:190,spd:26,dmg:22,r:9,ai:'brute',rate:0.33,bspd:80,xp:32},
  static:{name:'Static Wisp',hp:90,spd:38,dmg:16,r:5,ai:'shooter',rate:1.4,bspd:110,xp:22},
  guard:{name:'Corrupted Guard',hp:300,spd:42,dmg:26,r:8,ai:'shooter',rate:0.9,bspd:105,burst:3,xp:45},
  husk:{name:'Husk Turret',hp:240,spd:0,dmg:20,r:8,ai:'turret',pat:'ring',rate:0.45,bspd:85,xp:40},
  boss:{name:CONFIG.villain,hp:CONFIG.bossHp,spd:30,dmg:20,r:20,ai:'boss',xp:600}
};
const ZONE_SPAWN=[['mossling','mossling','wisp'],['crawler','crawler','wisp','turret'],['golem','crawler','turret','static'],['guard','golem','husk','static']];

/* =====================  world  ===================== */
const W=CONFIG.world,TS=16,C=W/2;
const T={VOID:0,FLOOR:1,WALL:2,GATE:3,TREE:4,ROCK:5,GEAR:6};
const tiles=new Uint8Array(W*W),zoneT=new Uint8Array(W*W),gateAt=new Int16Array(W*W).fill(-1);
const gates=[],terms=[];
const HUB={x:C*TS,y:C*TS};
const BOSSPOS={x:C*TS,y:(C-54)*TS};
const VAULT={x:C*TS+44,y:C*TS+8};
const seen=new Uint8Array(W*W);
const mapCv=document.createElement('canvas');mapCv.width=W;mapCv.height=W;const mapCtx=mapCv.getContext('2d');

function genWorld(){
  const rng=mulberry32(CONFIG.seed),R=CONFIG.zoneRadii;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const d=Math.hypot(x+.5-C,y+.5-C),i=y*W+x;
    const z=d<R[0]?0:d<R[1]?1:d<R[2]?2:d<R[3]?3:-1;
    tiles[i]=z<0?T.VOID:T.FLOOR;zoneT[i]=Math.max(z,0);
    for(let k=0;k<3;k++){const r=R[k];if(z>=0&&d>=r&&d<r+1.6)tiles[i]=T.WALL}
  }
  const offs=[Math.PI/4,0.12,Math.PI/4+0.35];
  for(let k=0;k<3;k++){
    for(let j=0;j<4;j++){
      const a=offs[k]+j*Math.PI/2,r=R[k]+0.8;
      const gx=C+Math.cos(a)*r,gy=C+Math.sin(a)*r;
      const g={id:gates.length,x:gx*TS,y:gy*TS,tx:gx,ty:gy,tier:k+1,open:save.gates.includes(gates.length),cells:[],cd:0};
      for(let y=Math.floor(gy-3);y<=Math.ceil(gy+3);y++)for(let x=Math.floor(gx-3);x<=Math.ceil(gx+3);x++){
        const i=y*W+x;if(x<0||y<0||x>=W||y>=W)continue;
        if(tiles[i]===T.WALL&&Math.hypot(x+.5-gx,y+.5-gy)<2.4){tiles[i]=T.GATE;gateAt[i]=g.id;g.cells.push(i)}
      }
      gates.push(g);
    }
  }
  const bx=C,by=C-54;
  const nearKeep=(x,y)=>{
    if(Math.hypot(x+.5-C,y+.5-C)<5)return true;
    if(Math.hypot(x+.5-bx,y+.5-by)<8)return true;
    for(const g of gates)if(Math.hypot(x+.5-g.tx,y+.5-g.ty)<4.6)return true;
    return false;
  };
  const dens=[0.07,0.10,0.09,0.06];
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const i=y*W+x;if(tiles[i]!==T.FLOOR||nearKeep(x,y))continue;
    const z=zoneT[i];if(rng()>=dens[z])continue;
    const q=rng();
    tiles[i]=z<=1?(q<.7?T.TREE:T.ROCK):z===2?(q<.5?T.GEAR:q<.75?T.ROCK:T.TREE):(q<.6?T.ROCK:T.GEAR);
  }
  const want=CONFIG.terminalsByZone;
  for(let z=0;z<4;z++){let n=0,tries=0;
    while(n<want[z]&&tries++<4000){
      const x=(rng()*W)|0,y=(rng()*W)|0,i=y*W+x;
      if(tiles[i]!==T.FLOOR||zoneT[i]!==z||nearKeep(x,y))continue;
      if(Math.hypot(x+.5-C,y+.5-C)>=CONFIG.zoneRadii[3]-2)continue;
      if(terms.some(t=>Math.hypot(t.tx-x,t.ty-y)<6))continue;
      terms.push({id:terms.length,tx:x,ty:y,x:x*TS+8,y:y*TS+12,zone:z,done:save.terms.includes(terms.length),cd:0});n++;
    }
  }
}
genWorld();
function tileAt(tx,ty){return(tx<0||ty<0||tx>=W||ty>=W)?T.VOID:tiles[ty*W+tx]}
function solidTile(tx,ty){
  if(tx<0||ty<0||tx>=W||ty>=W)return true;const i=ty*W+tx,t=tiles[i];
  if(t===T.FLOOR)return false;if(t===T.GATE)return!gates[gateAt[i]].open;return true;
}
const solidPx=(x,y)=>solidTile(Math.floor(x/TS),Math.floor(y/TS));
const blockedBox=(x,y,r)=>solidPx(x-r,y-r)||solidPx(x+r,y-r)||solidPx(x-r,y+r)||solidPx(x+r,y+r);
function zoneAtPx(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(tx<0||ty<0||tx>=W||ty>=W)return 3;return zoneT[ty*W+tx]}
const anomAt=(x,y)=>save.restored?null:ZONES[zoneAtPx(x,y)].anom;
function paintMapTile(i){
  const t=tiles[i];let c='#000';
  if(t===T.VOID)c='#06100f';else if(t===T.WALL)c='#8a6a40';else if(t===T.GATE)c=gates[gateAt[i]].open?'#7ad05a':'#e0603a';
  else if(t===T.TREE)c='#2a5a30';else{const z=zoneT[i];c=save.restored?'#5a9a45':['#4a8040','#587a3a','#5b6e6a','#6a4a90'][z]}
  mapCtx.fillStyle=c;mapCtx.fillRect(i%W,(i/W)|0,1,1);
}
function revealAround(px,py){
  const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
  for(let y=ty-10;y<=ty+10;y++)for(let x=tx-10;x<=tx+10;x++){
    if(x<0||y<0||x>=W||y>=W)continue;if(Math.hypot(x-tx,y-ty)>10)continue;
    const i=y*W+x;if(!seen[i]){seen[i]=1;paintMapTile(i)}
  }
}

/* =====================  items  ===================== */
function itemName(it){
  if(it.t==='weapon')return WK[it.k].names[it.tier];
  if(it.t==='armor')return ARMOR.names[it.tier];
  return RING.names[it.tier]+' Ring of '+RING.stats[it.stat];
}
function itemInfo(it){
  const n=itemName(it)+' (T'+(it.tier+1)+')';

function rollItem(zone,forceTier){

let dirtyInv=true,dirtyStats=true;
function nearestInteract(){
  let best=null,bd=1e9;
  for(const g of gates){if(g.open)continue;const d=Math.hypot(P.x-g.x,P.y-g.y);if(d<38&&d<bd){bd=d;best={k:'gate',o:g,txt:'[E] Repair gate (tier '+g.tier+')'}}}
  for(const t of terms){if(t.done)continue;const d=Math.hypot(P.x-t.x,P.y-t.y);if(d<24&&d<bd){bd=d;best={k:'term',o:t,txt:'[E] Repair dormant machine'}}}
  const dv=Math.hypot(P.x-VAULT.x,P.y-VAULT.y);if(dv<28&&dv<bd){best={k:'vault',txt:'[E] Open the shared Vault'}}
  return best;
}
let interact=null;
function update(dt){
  time+=dt;P.lastHit+=dt;
  const z=zoneAtPx(P.x,P.y);
  if(z!==P.zone||!P._zs){P.zone=z;P._zs=true;const zz=ZONES[z];log('Entered '+zz.name+'. '+(save.restored?'The world is mending.':zz.note),zz.anom&&!save.restored?'#e8d84a':'#bde8a0')}
  const an=anomAt(P.x,P.y);
  // movement
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const il=Math.hypot(ix,iy);if(il>0){ix/=il;iy/=il}
  const sp=speedPx();
  if(P.dash>0){P.dash-=dt;P.vx=P.dx*340;P.vy=P.dy*340;P.inv=Math.max(P.inv,.05);
    for(const e of enemies){if(Math.hypot(e.x-P.x,e.y-P.y)<e.r0+10&&!e._dh){e._dh=true;damageEnemy(e,28*playerDmgMult()*1.2)}}
    if(P.dash<=0)for(const e of enemies)e._dh=false}
  else{const acc=an==='slip'?170:1100;
    const tvx=ix*sp,tvy=iy*sp;P.vx+=clamp(tvx-P.vx,-acc*dt,acc*dt);P.vy+=clamp(tvy-P.vy,-acc*dt,acc*dt)}
  const ox=P.x,oy=P.y;
  if(!blockedBox(P.x+P.vx*dt,P.y,5))P.x+=P.vx*dt;else P.vx=0;
  if(!blockedBox(P.x,P.y+P.vy*dt,5))P.y+=P.vy*dt;else P.vy=0;
  P.step+=Math.hypot(P.x-ox,P.y-oy)*.35;
  revealAround(P.x,P.y);
  // aim & fire
  P.aim=Math.atan2(camY+mouse.y-(P.y-8),camX+mouse.x-P.x);
  P.fireCd-=dt;P.spCd-=dt;P.inv-=dt;P.flash-=dt;
  const dex=stat('dex');
  if(mouse.down&&P.fireCd<=0&&P.eq.weapon){fireWeapon(P.aim);P.fireCd=1/(WK[P.eq.weapon.k].rate*(.75+dex*.05));sfx(P.cls==='archer'?520:P.cls==='wizard'?420:260,.05,P.cls==='knight'?'sawtooth':'square',.02)}
  P.en=Math.min(100,P.en+(8+effTech()*.7)*dt);
  if((keys[' ']||mouse.right)&&P.spCd<=0&&P.en>=CLASSES[P.cls].cost)doSpecial();
  P.hp=Math.min(maxHp(),P.hp+(P.lastHit>4?2.4:.8)*dt);
  // hub safe zone
  if(Math.hypot(P.x-HUB.x,P.y-HUB.y)<46){P.hp=Math.min(maxHp(),P.hp+CONFIG.hubHealPerSec*dt);P.en=Math.min(100,P.en+20*dt)}
  // recall
  if(P.recall>0){P.recall-=dt;if(P.recall<=0){P.x=HUB.x;P.y=HUB.y+26;P.vx=P.vy=0;burst(P.x,P.y-6,20,'#9a6ae8',60,.7);log('Recalled to the hub.','#9a6ae8');sfx(300,.4,'triangle',.05,400)}}
  interact=nearestInteract();
  // companion
  companion.x+=(P.x-18-companion.x)*Math.min(1,dt*3);companion.y+=(P.y+4-companion.y)*Math.min(1,dt*3);
  updateEnemies(dt);updateProjs(dt);updateLoot(dt);
  respawnT-=dt;if(respawnT<=0){respawnT=CONFIG.respawnEvery;trySpawnNear()}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt}parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=18*dt;f.life-=dt}floats=floats.filter(f=>f.life>0);
  for(const m of motes){m.x-=(P.vx*.02+4)*m.z*dt;m.y+=Math.sin(time+m.ph)*6*dt;if(m.x<-4)m.x=644;if(m.y<-4)m.y=364;if(m.y>364)m.y=-4}
  for(const g of gates)if(g.cd>0)g.cd-=dt;for(const t of terms)if(t.cd>0)t.cd-=dt;
}
for(const k in ETYPES)ETYPES[k].r0=ETYPES[k].r;
function doSpecial(){
  const c=CLASSES[P.cls];P.en-=c.cost;P.spCd=.5;sfx(200,.25,'sawtooth',.05,300);
  if(P.cls==='knight'){P.dash=.22;P.dx=Math.cos(P.aim);P.dy=Math.sin(P.aim);P.inv=.4;burst(P.x,P.y-6,10,'#cfe0cf',60,.4)}
  else if(P.cls==='archer'){for(let i=-3;i<=3;i++)fireWeapon(P.aim,.9,i*.16)}
  else{for(let i=0;i<16;i++)fireWeapon(i/16*TAU,1.1)}
}
function updateEnemies(dt){
  for(const e of enemies){
    const d=ETYPES[e.t];if(e.flash>0)e.flash-=dt;
    const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy);
    if(dist>620&&e.t!=='boss')continue;
    const ang=Math.atan2(dy,dx);e.ang=ang;e.cd-=dt;e.touch-=dt;
    const hubD=Math.hypot(e.x-HUB.x,e.y-HUB.y);
    if(hubD<110&&e.t!=='boss'){const a=Math.atan2(e.y-HUB.y,e.x-HUB.x);mv(e,Math.cos(a)*60*dt,Math.sin(a)*60*dt,d.r);e.aggro=false;continue}
    const aggroR=d.ai==='melee'?150:d.ai==='turret'?200:180;
    if(!e.aggro&&dist<aggroR)e.aggro=true;
    if(e.aggro&&dist>300&&e.t!=='boss')e.aggro=false;
    if(d.ai==='melee'){
      if(e.aggro){mv(e,Math.cos(ang)*d.spd*dt,Math.sin(ang)*d.spd*dt,d.r);if(dist<d.r+8&&e.touch<=0){takeDamage(d.dmg);e.touch=.8}}
      else wander(e,dt,d)
    }else if(d.ai==='shooter'){
      if(e.aggro){
        const want=dist>130?1:dist<85?-1:0;e.wt-=dt;if(e.wt<=0){e.wt=1+rnd()*1.2;e.wa=rnd()<.5?1:-1}
        const sx=-Math.sin(ang)*e.wa*.6,sy=Math.cos(ang)*e.wa*.6;
        mv(e,(Math.cos(ang)*want+sx)*d.spd*dt,(Math.sin(ang)*want+sy)*d.spd*dt,d.r);
        if(e.cd<=0){e.cd=1/d.rate;const n=d.burst||1;for(let i=0;i<n;i++)eBullet(e.x,e.y-6,ang+(i-(n-1)/2)*.16,d.bspd,d.dmg,{col:e.t==='static'||e.t==='guard'?'#d05ae8':'#f0903a'});}
        if(dist<d.r+6&&e.touch<=0){takeDamage(d.dmg*.6);e.touch=1}
      }else wander(e,dt,d)
    }else if(d.ai==='turret'){
      if(e.aggro&&e.cd<=0){e.cd=1/d.rate;
        if(d.pat==='spread'){for(let i=-1;i<=1;i++)eBullet(e.x,e.y-8,ang+i*.28,d.bspd,d.dmg)}
        else{const off=rnd()*TAU;for(let i=0;i<10;i++)eBullet(e.x,e.y-8,off+i/10*TAU,d.bspd,d.dmg,{col:'#d05ae8'})}
      }
    }else if(d.ai==='brute'){
      if(e.aggro){mv(e,Math.cos(ang)*d.spd*dt,Math.sin(ang)*d.spd*dt,d.r);
        if(e.cd<=0){e.cd=1/d.rate;for(let i=0;i<8;i++)eBullet(e.x,e.y-8,i/8*TAU+rnd()*.2,d.bspd,d.dmg*.7)}
        if(dist<d.r+8&&e.touch<=0){takeDamage(d.dmg);e.touch=.9}}
      else wander(e,dt,d)
    }else if(d.ai==='boss'){updateBoss(e,dt,dist,ang)}
  }
}
function mv(e,dx,dy,r){if(!blockedBox(e.x+dx,e.y,r))e.x+=dx;if(!blockedBox(e.x,e.y+dy,r))e.y+=dy}
function wander(e,dt,d){e.wt-=dt;if(e.wt<=0){e.wt=1+rnd()*2;e.wa=rnd()<.4?-1:rnd()*TAU}
  if(e.wa>=0&&d.spd>0)mv(e,Math.cos(e.wa)*d.spd*.3*dt,Math.sin(e.wa)*d.spd*.3*dt,d.r)}
function updateBoss(e,dt,dist,ang){
  if(!bossAwake){if(dist<300)bossAwake=true;else return}
  const hr=e.hp/e.max,ph=hr>.66?1:hr>.33?2:3;
  const want=dist>150?1:dist<90?-1:0;const sx=-Math.sin(ang)*.7,sy=Math.cos(ang)*.7;
  const sp=ph===3?40:30;mv(e,(Math.cos(ang)*want+sx)*sp*dt,(Math.sin(ang)*want+sy)*sp*dt,18);

  if(ph>=2&&e.s4<=0){e.s4=7;const n=enemies.filter(x=>x.t==='crawler').length;if(n<8){for(let i=0;i<2;i++){const a=rnd()*TAU;const m=spawnEnemy('crawler',e.x+Math.cos(a)*30,e.y+Math.sin(a)*30);m.aggro=true}}log(CONFIG.villain+' calls rust crawlers!','#e85ae8')}

function trySpawnNear(){
  const cap=save.restored?4:CONFIG.nearCap;
  let n=0;for(const e of enemies)if(Math.hypot(e.x-P.x,e.y-P.y)<450&&e.t!=='boss')n++;
  if(n>=cap)return;
  for(let k=0;k<12;k++){
    const a=rnd()*TAU,r=270+rnd()*90,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r;
    const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(tx<0||ty<0||tx>=W||ty>=W)continue;
    if(tiles[ty*W+tx]!==T.FLOOR)continue;
    if(Math.hypot(x-HUB.x,y-HUB.y)<130)continue;
    if(Math.hypot(x-BOSSPOS.x,y-BOSSPOS.y)<150)continue;
    const z=zoneT[ty*W+tx];if(!freeSpot(x,y,8))continue;
    spawnEnemy(ZONE_SPAWN[z][(rnd()*ZONE_SPAWN[z].length)|0],x,y);return;
  }

function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];if(!p)continue;p.age+=dt;p.life-=dt;
    const an=anomAt(p.x,p.y);let f=1;
    if(an==='curve')p.ang+=.95*dt;
    else if(an==='slip')p.spd=Math.min(p.spd*(1+.55*dt),p.spd0?p.spd0*1.9:(p.spd0=p.spd,p.spd*1.9));
    else if(an==='pulse')f=1+.65*Math.sin(p.age*6);
    if(p.spd0===undefined)p.spd0=p.spd;
    p.x+=Math.cos(p.ang)*p.spd*f*dt;p.y+=Math.sin(p.ang)*p.spd*f*dt;
    if(p.life<=0||solidPx(p.x,p.y)){if(p.life>0)burst(p.x,p.y,3,'#aaa',20,.2);projs.splice(i,1);continue}
    if(p.from==='p'){
      let dead=false;
      for(const e of enemies){
        const rr=e.r0+p.r;if(Math.abs(e.x-p.x)>rr||Math.abs(e.y-6-p.y)>rr+6)continue;
        if(Math.hypot(e.x-p.x,e.y-8-p.y)>rr+4)continue;
        if(p.hit){if(p.hit.has(e))continue;p.hit.add(e)}
        damageEnemy(e,p.dmg);if(!p.pierce){dead=true;break}
      }
      if(dead)projs.splice(i,1);
    }else{
      if(Math.hypot(P.x-p.x,P.y-8-p.y)<p.r+5){takeDamage(p.dmg);projs.splice(i,1)}
    }
  }
}
function updateLoot(dt){
  for(let i=loots.length-1;i>=0;i--){
    const l=loots[i];l.life-=dt;if(l.delay>0)l.delay-=dt;
    if(l.life<=0){loots.splice(i,1);continue}
    if(l.delay>0)continue;
    const d=Math.hypot(P.x-l.x,P.y-l.y);
    const cd=Math.hypot(companion.x-l.x,companion.y-l.y);
    if(Math.min(d,cd+6)<(l.potion?24:14)){
      if(l.potion){givePotion(l.potion);loots.splice(i,1)}
      else if(giveItem(l.item)){log('Picked up '+itemName(l.item)+'.',TIERCOL[l.item.tier]);sfx(500,.08,'triangle',.04,200);loots.splice(i,1)}
      else if(!l.warned||time-l.warned>3){l.warned=time;log('Your pack is full.','#ff7a6a')}
    }
  }
}

function interactNow(){
  if(!interact)return;
  if(interact.k==='vault'){openVault();return}
  const o=interact.o;
  if(o.cd>0){log('The circuits are still sparking. Wait a moment.','#ff7a6a');return}
  const isGate=interact.k==='gate';
  const tl=effTech();
  const base=isGate?2+o.tier:2+Math.min(o.zone+1,3);
  const pairs=Math.min(6,base+(isGate?0:0));
  const pre=Math.min(Math.max(0,pairs-2),Math.floor((tl-1)/2));
  const time=20+pairs*3+tl*2;
  startWire(isGate?'Repair gate (tier '+o.tier+')':'Repair dormant machine',pairs,pre,time,
    ()=>{ // success
      gainTech(isGate?25*o.tier:18);
      if(isGate){o.open=true;save.gates.push(o.id);for(const i of o.cells)paintMapTile(i);log('The gate grinds open.','#7ad05a');
        for(let k=0;k<2;k++)addLoot(o.x,o.y+14,{potion:pick(POT_KEYS)});addLoot(o.x,o.y+14,{item:rollItem(Math.min(3,o.tier))});}
      else{o.done=true;save.terms.push(o.id);log('The machine hums back to life.','#7ad05a');
        addLoot(o.x,o.y+8,{potion:pick(POT_KEYS)});if(rnd()<.55)addLoot(o.x,o.y+8,{item:rollItem(o.zone)})}
      persist();burst(o.x,o.y-6,16,'#7ad05a',60,.7);sfx(700,.3,'triangle',.05,500);
    },
    ()=>{o.cd=3;P.inv=0;takeDamage(isGate?8:5+(o.zone||0)*2);log('Short circuit! Zapped.','#ff7a6a')}
  );
}
const WCOL=['#e84b4b','#4bd0e8','#f0d24a','#7ad05a','#c46ae8','#f08a3a'];
const wire={on:false};
function startWire(title,pairs,pre,tmax,onWin,onFail){
  const perm=[...Array(pairs).keys()];for(let i=pairs-1;i>0;i--){const j=(rnd()*(i+1))|0;[perm[i],perm[j]]=[perm[j],perm[i]]}
  const done=Array(pairs).fill(false);const idx=[...Array(pairs).keys()].sort(()=>rnd()-.5);for(let k=0;k<pre;k++)done[idx[k]]=true;
  Object.assign(wire,{on:true,pairs,perm,done,sel:-1,miss:0,t:tmax,max:tmax,onWin,onFail,title,pre,end:false});
  renderWire();openModal('wire');
}
function renderWire(){
  const w=wire,H=150,step=H/w.pairs;
  let svg='',nodes='';
  for(let i=0;i<w.pairs;i++){
    const yl=step*i+step/2,ri=w.perm.indexOf(i),yr=step*ri+step/2;
    if(w.done[i])svg+=`<polyline fill="none" stroke="${WCOL[i]}" stroke-width="4" points="22,${yl} 90,${yl} 170,${yr} 238,${yr}"/>`;
    nodes+=`<button class="node${w.done[i]?' done':''}${w.sel===i?' sel':''}" style="--c:${WCOL[i]};left:4px;top:${yl-9}px" data-side="L" data-c="${i}" aria-label="Left terminal ${i+1}"></button>`;
    const c=w.perm[ri===undefined?0:ri];
  }
  for(let r=0;r<w.pairs;r++){const c=w.perm[r],yr=step*r+step/2;
    nodes+=`<button class="node${w.done[c]?' done':''}" style="--c:${WCOL[c]};left:238px;top:${yr-9}px" data-side="R" data-c="${c}" aria-label="Right terminal ${r+1}"></button>`}
  $('m-wire').innerHTML=`<h2>${w.title}</h2><p>Join each colour on the left to its match on the right. ${w.pre?'<span class="good">'+w.pre+' wire'+(w.pre>1?'s':'')+' pre-linked by your Tech skill.</span>':''}</p>
  <div class="tbar"><div id="wt" style="width:${w.t/w.max*100}%"></div></div>
  <div id="wireArea"><svg width="260" height="150">${svg}</svg>${nodes}</div>
  <div class="row"><span id="wm" class="dim">Mistakes: ${w.miss}/3</span><span style="flex:1"></span><button class="btn" id="wcancel">Step back (Esc)</button></div>`;
  $('wcancel').onclick=()=>cancelWire();
  $('m-wire').querySelectorAll('.node').forEach(n=>n.onclick=()=>wireClick(n));
}
function wireClick(n){
  const w=wire;if(!w.on||w.end)return;const c=+n.dataset.c;
  if(w.done[c])return;
  if(n.dataset.side==='L'){w.sel=c;sfx(500,.04,'square',.02);renderWire();return}
  if(w.sel<0){return}
  if(w.sel===c){w.done[c]=true;w.sel=-1;sfx(660,.08,'triangle',.04);renderWire();
    if(w.done.every(Boolean)){w.end=true;setTimeout(()=>{if(!w.on)return;w.on=false;closeModal();w.onWin()},350)}}
  else{w.miss++;w.sel=-1;sfx(110,.15,'sawtooth',.05);renderWire();n=$('m-wire').querySelector(`.node[data-side="R"][data-c="${c}"]`);if(n){n.classList.add('bad')}
    if(w.miss>=3){failWire()}}
}
function failWire(){const w=wire;if(!w.on)return;w.on=false;w.end=true;closeModal();w.onFail()}
function cancelWire(){wire.on=false;closeModal()}
function tickWire(dt){
  if(!wire.on||wire.end)return;wire.t-=dt;const el=$('wt');if(el)el.style.width=Math.max(0,wire.t/wire.max*100)+'%';
  const m=$('wm');if(m)m.textContent='Mistakes: '+wire.miss+'/3   Time: '+Math.max(0,wire.t).toFixed(0)+'s';
  if(wire.t<=0)failWire();
}

  for(const f of floats){c.globalAlpha=clamp(f.life*1.5,0,1);c.fillStyle='#000';c.fillText(f.txt,Math.round(f.x-camX)+1,Math.round(f.y-camY)+1);c.fillStyle=f.col;c.fillText(f.txt,Math.round(f.x-camX),Math.round(f.y-camY))}c.globalAlpha=1;
  // zone tint
  if(!save.restored){const z=zoneAtPx(P.x,P.y);if(z===3){c.fillStyle='rgba(90,20,130,'+(.12+.05*Math.sin(ti*3))+')';c.fillRect(0,0,640,360);if(Math.random()<.04){c.fillStyle='rgba(220,150,255,.12)';c.fillRect(0,(Math.random()*360)|0,640,2)}}
    else if(z===2){c.fillStyle='rgba(30,60,70,.1)';c.fillRect(0,0,640,360)}}
  else{c.fillStyle='rgba(255,226,160,.07)';c.fillRect(0,0,640,360)}
  vignette(c);
}
function drawHubDecorQueue(list,ti){list.push({y:HUB.y-20,f:g=>drawHubDecor(g,ti)})}

/* =====================  input  ===================== */
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='escape'){if(modal==='wire')cancelWire();else if(modal&&modal!=='class'&&modal!=='dead'&&modal!=='win')closeModal();else if(!modal&&running)showMenu();else if(modal==='win')closeModal();return}
  if(modal){return}
  if(!running)return;
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='e')interactNow();
  else if(k==='r'&&P.recall<=0){P.recall=3;log('Recalling to the hub… stay out of harm’s way.','#9a6ae8')}
  else if(k==='1')showTech();else if(k==='2')showStats();else if(k==='3')showBook();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=mouse.right=false});
function setMouse(e){const r=$('stage').getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*640;mouse.y=(e.clientY-r.top)/r.height*360}
cv.addEventListener('mousemove',setMouse);window.addEventListener('mousemove',setMouse);
cv.addEventListener('mousedown',e=>{setMouse(e);if(e.button===0)mouse.down=true;if(e.button===2)mouse.right=true;if(ac&&ac.state==='suspended')ac.resume()});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.right=false});
$('bTech').onclick=()=>{if(running&&!modal)showTech()};$('bStats').onclick=()=>{if(running&&!modal)showStats()};
$('bBook').onclick=()=>{if(running&&!modal)showBook()};$('bGear').onclick=()=>{if(running&&!modal)showMenu()};

/* =====================  scale + loop  ===================== */
function fit(){const s=Math.min(innerWidth/640,innerHeight/360);$('stage').style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running&&!modal)update(dt);
  else if(modal==='wire')tickWire(dt);
  else if(!running){time+=dt;for(const m of motes){m.x-=4*m.z*dt;if(m.x<-4)m.x=644}}
  render();updateHUD();drawMini();
  requestAnimationFrame(frame);
}
P.zone=0;revealAround(HUB.x,HUB.y);
for(let i=0;i<W*W;i++)if(seen[i])paintMapTile(i);
showClassSelect(true);
requestAnimationFrame(frame);
})();
</script>
</body>
